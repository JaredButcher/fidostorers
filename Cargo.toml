[workspace]
resolver = "2"
members = ["crates/fido-token", "crates/fidostorers"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JaredButcher/fidostorers"
rust-version = "1.75"

[workspace.dependencies]
fido-token = { path = "crates/fido-token", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
# Argon2id for the keyfile+password factor. Memory-hard, because that factor is
# the only one an attacker can grind offline. See plan/10-keyfile-password-auth.md.
argon2 = "0.5"
# `use-std` gives the alloc-backed (de)serializers; the default feature set is
# heapless-oriented and has no `to_stdvec`.
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Used for the temp-file-then-rename write path, so a crash mid-write cannot
# corrupt an existing vault (plan/02, "Crash safety").
tempfile = "3"
# Directory-mode archiving. Streams well and avoids inventing an archive format.
tar = "0.4"
# Dev-only: property tests for the kv and dir round trips (plan/05).
proptest = "1"
log = "0.4"
env_logger = "0.11"
rpassword = "7"

# Mozilla's CTAP1/CTAP2 stack (the one Firefox ships). `crypto_rust` picks the
# pure-Rust crypto backend so no NSS/OpenSSL system libraries are needed; the
# default `crypto_nss` backend would drag in bindgen and an NSS install.
# See plan/07-open-decisions.md #1.
authenticator = { version = "0.5", default-features = false, features = ["crypto_rust"] }

# Not used directly. `authenticator`'s Windows HID backend passes a
# `std::os::windows::io::RawHandle` (= `*mut core::ffi::c_void`) to a winapi
# function expecting `*mut winapi::ctypes::c_void`. Those are the same type only
# when winapi's `std` feature is on, and `authenticator` does not enable it, so
# the crate fails to compile for Windows on its own. Declaring winapi here with
# `std` turns it on graph-wide via feature unification. Remove once the upstream
# crate enables it itself. See docs/M1-MANUAL-TESTING.md.
winapi = { version = "0.3.9", features = ["std"] }

[profile.release]
# Key material lives in this process; strip debug info from release builds so
# secrets are less likely to linger in shipped binaries/symbol files.
strip = true
