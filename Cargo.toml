[workspace]
resolver = "2"
members = ["crates/fido-token", "crates/fidostorers"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JaredButcher/fidostorers"
rust-version = "1.75"

[workspace.dependencies]
fido-token = { path = "crates/fido-token" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
# Key material lives in this process; strip debug info from release builds so
# secrets are less likely to linger in shipped binaries/symbol files.
strip = true
