[package]
name = "fidostorers"
description = "Encrypt files, directories, and key/value secrets using a FIDO2 security key."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fidostorers"
path = "src/lib.rs"

[[bin]]
name = "fidostorers"
path = "src/bin/fidostorers.rs"

[features]
default = ["hardware"]
# Passes through to `fido-token`'s feature of the same name; see that crate's
# manifest for why it exists.
hardware = ["fido-token/hardware"]

[dependencies]
fido-token = { workspace = true, default-features = false }
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
clap.workspace = true
anyhow.workspace = true
rand.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
rpassword.workspace = true
postcard.workspace = true
tempfile.workspace = true
tar.workspace = true

[dev-dependencies]
proptest.workspace = true
