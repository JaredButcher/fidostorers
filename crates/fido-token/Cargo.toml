[package]
name = "fido-token"
description = "Talk to FIDO2/U2F security keys and derive stable secrets from the hmac-secret CTAP2 extension."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fido_token"
path = "src/lib.rs"

[[bin]]
name = "fido-token"
path = "src/bin/fido-token.rs"

[features]
default = ["hardware"]

# Compiles the real CTAP2 backend (`HidAuthenticator`) against the
# `authenticator` crate. On by default; turn it off to build/test the
# hardware-free parts of this crate on a machine that cannot satisfy the
# platform build dependencies (Linux needs pkg-config + libudev headers).
# With it off, `HidAuthenticator`'s methods return
# `TokenError::BackendUnavailable` and everything else still works.
hardware = ["dep:authenticator"]

# Exposes `fake::FakeAuthenticator`, a pure-software `Authenticator` impl used by
# this crate's own tests and reusable by downstream crates (e.g. fidostorers) so
# their tests don't need physical hardware either. See plan/05-testing-strategy.md.
test-util = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
clap.workspace = true
anyhow.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
rpassword.workspace = true
env_logger.workspace = true

log.workspace = true
authenticator = { workspace = true, optional = true }

# See the comment on `winapi` in the workspace Cargo.toml: this is a
# feature-unification shim for `authenticator`'s Windows backend, not a
# dependency this crate calls into.
[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["setupapi", "hidclass", "hidpi", "hidsdi", "handleapi", "fileapi", "winbase", "errhandlingapi", "guiddef", "minwindef", "ntdef", "winnt", "winerror", "hidusage"] }
