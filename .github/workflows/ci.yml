name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The `authenticator` crate's Linux HID backend links libudev, so the
      # default-featured build needs its headers. Windows needs nothing extra.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build
        run: cargo build --workspace --all-targets

      # Hardware-in-the-loop tests (plan/05-testing-strategy.md) need a physical
      # security key and are `#[ignore]`-gated; only the hardware-free suite runs
      # here, which is the whole point of the Authenticator trait split.
      - name: Test
        run: cargo test --workspace --features fido-token/test-util

      # The `hardware` feature is what pulls in the platform HID stack. Building
      # without it must keep working, so that the hardware-free tests stay runnable
      # on a machine that cannot satisfy those platform build dependencies.
      - name: Test without the hardware backend
        run: cargo test --workspace --no-default-features --features fido-token/test-util

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features fido-token/test-util -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check
